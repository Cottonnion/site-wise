name: Release

on:
  push:
    tags:
      - 'v*'
      - '[0-9]*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: Build & Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          coverage: none
          tools: composer:v2

      - name: PHP syntax check
        run: |
          php -l site-wise.php
          find app templates -type f -name '*.php' -print0 | xargs -0 -n1 php -l

      - name: Install dependencies
        run: |
          composer validate --no-check-publish
          composer install --no-dev --no-interaction --prefer-dist --optimize-autoloader

      - name: Resolve version
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Build plugin zip
        run: |
          set -euo pipefail
          PKG="${RUNNER_TEMP}/site-wise"
          mkdir -p "${PKG}"
          tar --exclude='.git' --exclude='.github' --exclude='.gitignore' \
              --exclude='dist' --exclude='*.zip' --exclude='.DS_Store' \
              -cf - . | tar -xf - -C "${PKG}"
          mkdir -p dist
          ZIP="${GITHUB_WORKSPACE}/dist/site-wise-${{ steps.version.outputs.version }}.zip"
          ( cd "${RUNNER_TEMP}" && zip -rq "${ZIP}" site-wise )
          shasum -a 256 "${ZIP}" > "${ZIP}.sha256"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: site-wise-${{ steps.version.outputs.version }}-build
          path: dist/*

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          tag_name: ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            dist/*.zip
            dist/*.zip.sha256
          fail_on_unmatched_files: true