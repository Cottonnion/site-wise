name: Release & Deploy to WordPress.org

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag, e.g. v1.1.1'
        required: true
        type: string

permissions:
  contents: write

jobs:
  build-and-deploy:
    name: Build, Release & Deploy to WP.org SVN
    runs-on: ubuntu-latest
    env:
      PLUGIN_SLUG: loghaven-site-logs
      WPORG_USERNAME: yahyadeved
      SVN_URL: https://plugins.svn.wordpress.org/loghaven-site-logs
      DIST_DIR: ${{ github.workspace }}/dist

    steps:
      - name: Resolve release tag
        id: release_tag
        run: |
          set -euo pipefail
          if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ]; then
            TAG="${{ inputs.tag }}"
          else
            TAG="${GITHUB_REF_NAME}"
          fi
          VERSION="${TAG#v}"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "zip_name=${PLUGIN_SLUG}-${VERSION}.zip" >> "$GITHUB_OUTPUT"

      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.release_tag.outputs.tag }}

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          coverage: none
          tools: composer:v2

      - name: Validate Composer metadata
        run: composer validate --no-check-publish

      - name: PHP syntax check
        run: |
          php -l site-wise.php
          find app templates -type f -name '*.php' -print0 | xargs -0 -n1 php -l

      - name: Install production dependencies
        run: composer install --no-dev --no-interaction --prefer-dist --optimize-autoloader

      - name: Build plugin ZIP for GitHub release
        run: |
          set -euo pipefail
          PKG="${RUNNER_TEMP}/${PLUGIN_SLUG}"
          mkdir -p "${PKG}" "${DIST_DIR}"

          tar --exclude='.git' \
              --exclude='.github' \
              --exclude='.gitignore' \
              --exclude='.wordpress-org' \
              --exclude='dist' \
              --exclude='*.zip' \
              --exclude='.DS_Store' \
              -cf - . | tar -xf - -C "${PKG}"

          ZIP="${DIST_DIR}/${{ steps.release_tag.outputs.zip_name }}"
          ( cd "${RUNNER_TEMP}" && zip -rq "${ZIP}" "${PLUGIN_SLUG}" )
          shasum -a 256 "${ZIP}" > "${ZIP}.sha256"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ steps.release_tag.outputs.tag }}
          tag_name: ${{ steps.release_tag.outputs.tag }}
          generate_release_notes: true
          files: |
            dist/*.zip
            dist/*.zip.sha256
          fail_on_unmatched_files: true

      - name: Install Subversion
        run: sudo apt-get update -q && sudo apt-get install -y subversion

      - name: Deploy to WordPress.org SVN
        env:
          WPORG_SVN_PASSWORD: ${{ secrets.WPORG_SVN_PASSWORD }}
        run: |
          set -euo pipefail
          VERSION="${{ steps.release_tag.outputs.version }}"

          # Checkout trunk and assets separately (avoids shallow working-copy depth issues)
          rm -rf /tmp/svn-trunk /tmp/svn-assets
          svn checkout "${SVN_URL}/trunk" /tmp/svn-trunk
          svn checkout "${SVN_URL}/assets" /tmp/svn-assets

          # Sync plugin files to SVN trunk
          rsync -a --delete ./ /tmp/svn-trunk/ \
            --exclude '.git/' \
            --exclude '.github/' \
            --exclude '.wordpress-org/' \
            --exclude 'dist/' \
            --exclude '.gitignore' \
            --exclude 'composer.json' \
            --exclude 'composer.lock' \
            --exclude 'readme.md' \
            --exclude '.DS_Store' \
            --exclude '.svn/'

          # Stage changes in trunk
          cd /tmp/svn-trunk
          svn status | grep '^?' | awk '{print $2}' | xargs -r svn add --force || true
          svn status | grep '^!' | awk '{print $2}' | xargs -r svn delete --force || true

          # Commit trunk
          if svn status | grep -q '^[ACDMR]'; then
            svn commit \
              --username "${WPORG_USERNAME}" \
              --password "${WPORG_SVN_PASSWORD}" \
              --non-interactive \
              --message "Release ${VERSION} to trunk"
          fi

          # Tag release from trunk
          TAG_URL="${SVN_URL}/tags/${VERSION}"
          if svn ls "${TAG_URL}" --username "${WPORG_USERNAME}" --password "${WPORG_SVN_PASSWORD}" --non-interactive >/dev/null 2>&1; then
            svn delete "${TAG_URL}" \
              --username "${WPORG_USERNAME}" \
              --password "${WPORG_SVN_PASSWORD}" \
              --non-interactive \
              --message "Remove stale tag ${VERSION} before recreating"
          fi
          svn copy "${SVN_URL}/trunk" "${TAG_URL}" \
            --username "${WPORG_USERNAME}" \
            --password "${WPORG_SVN_PASSWORD}" \
            --non-interactive \
            --message "Tag version ${VERSION}"

          # Sync and commit assets (.wordpress-org)
          if [ -d "${GITHUB_WORKSPACE}/.wordpress-org" ]; then
            rsync -a --delete "${GITHUB_WORKSPACE}/.wordpress-org/" /tmp/svn-assets/ \
              --exclude '.svn/'
            cd /tmp/svn-assets

            find . -type f -name '*.png' -exec svn propset svn:mime-type image/png {} + 2>/dev/null || true
            find . -type f -name '*.jpg' -exec svn propset svn:mime-type image/jpeg {} + 2>/dev/null || true
            find . -type f -name '*.svg' -exec svn propset svn:mime-type image/svg+xml {} + 2>/dev/null || true

            svn status | grep '^?' | awk '{print $2}' | xargs -r svn add --force || true
            svn status | grep '^!' | awk '{print $2}' | xargs -r svn delete --force || true

            if svn status | grep -q '^[ACDMR]'; then
              svn commit \
                --username "${WPORG_USERNAME}" \
                --password "${WPORG_SVN_PASSWORD}" \
                --non-interactive \
                --message "Update assets for ${VERSION}"
            fi
          fi
